    <!--
    SPECIFICATION (from chapter index.md):

    Type: data-visualization
    sim-id: polarization-index
    Library: p5.js
    Status: Built

    Purpose: Visualize the long-run trajectory of U.S. political polarization
    using a DW-NOMINATE-style party-median distance series for the House and
    Senate from 1879 to 2024. Students identify periods of greatest change
    (post-Reconstruction high, mid-century low, post-1980s rise, 2000s
    acceleration) and evaluate competing explanations for the modern rise.

    Bloom Level: Analyze (L4)
    Bloom Verb: Interpret

    Learning Objective: Students interpret data on American political
    polarization over time, identify the periods of greatest change, and
    evaluate competing explanations for increasing polarization
    (gerrymandering, primary system, social media, residential sorting,
    partisan media).

    Interactivity:
    - "Chamber" dropdown toggles House, Senate, or both.
    - "Overlay" dropdown highlights the period each competing explanation
      claims to drive, with a note describing the strongest evidence for
      and against it.
    - "Inflection points" checkbox annotates the four key turning points.
    - Click any period band (Post-Reconstruction, Gilded → Progressive,
      New Deal Era, Mid-Century Low, Post-1980s Rise, 2000s Acceleration)
      for a context paragraph.

    Color scheme: Blue for House, red for Senate; gold for the active
    explanation overlay band; muted alternating bands for the six periods.
    -->
