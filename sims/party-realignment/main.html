    <!--
    SPECIFICATION (from chapter index.md):

    Type: map-comparison
    sim-id: party-realignment
    Library: p5.js
    Status: Built

    Purpose: Allow students to visualize the dramatic realignment of American political parties from the New Deal coalition (1932-1968) to the Reagan coalition (1980-present), understanding how demographic and geographic sorting has shaped contemporary polarization.

    Bloom Level: Analyze (L4)
    Bloom Verb: Map

    Learning Objective: Students map the demographic and geographic components of the New Deal and Reagan coalitions, identify the key groups that switched parties, and analyze what drove the realignment.

    Canvas layout:
    - Two side-by-side coalition columns: New Deal Coalition (left) and Reagan Coalition (right)
    - Demographic groups colored blue (Democratic) to red (Republican) by party affinity at the selected year
    - Year slider 1932-2000 animates the realignment
    - Animated arrows show migration: southern whites and working-class whites moving R, African Americans solidifying D, evangelicals moving R
    - Click any group for vote-share data and the historical drivers (CRA 1964, Moral Majority 1979, deindustrialization, Southern Strategy)

    Color scheme: Traditional blue (Democrat) and red (Republican); intensity indicates strength of affinity; purple indicates split/transitional.
    -->
