    <!--
    SPECIFICATION (from chapter index.md):

    Type: map
    sim-id: revolutionary-war-battles
    Library: p5.js
    Status: Built

    Purpose: Allow students to explore the geographic distribution of major
    Revolutionary War battles, understand the strategic logic of each campaign,
    and identify how the war's geography shaped its outcome.

    Bloom Level: Understand (L2)
    Bloom Verb: Explain

    Learning Objective: Students explain the strategic significance of at least
    three major Revolutionary War battles and describe how geography influenced
    the war's outcome.

    Canvas layout:
    - Responsive width; height ~600px (drawHeight 540 + controlHeight 60)
    - Simplified eastern seaboard map (Maine to Georgia)
    - British-controlled coastal cities and contested interior shaded
    - Battle sites as 5-point stars (gold = American win, red = British win)
    - Valley Forge marked with a brown tent icon (winter encampment, not a battle)

    Battles included:
    Bunker Hill 1775, Trenton 1776, Brandywine/Philadelphia 1777,
    Saratoga 1777, Valley Forge 1777-78, Charleston 1780,
    Cowpens 1781, Yorktown 1781.

    Click a battle: date, outcome, two-sentence strategic significance,
    and a one-line "Why it mattered" connecting to the overall war arc.

    Campaign overlay toggle draws:
    - Northern campaign (1775-76): Boston > New York > Trenton/Princeton > Saratoga
    - Southern campaign (1780-81): Charleston > inland > Cowpens > Yorktown
    -->
</body>
