    <!--
    SPECIFICATION (from chapter index.md):

    Type: timeline
    sim-id: progressive-amendments-timeline
    Library: p5.js
    Status: Built

    Purpose: Allow students to explore the four Progressive Era constitutional
    amendments (16th–19th), the social movements that produced them, and the
    political context in which each was ratified.

    Bloom Level: Understand (L2)
    Bloom Verb: Explain

    Learning Objective: Students explain the purpose of each Progressive Era
    amendment and the social movement or political pressure that produced it.

    Canvas layout:
    - Responsive width; height 560px (drawHeight 500 + controlHeight 60)
    - Horizontal timeline from 1900 to 1925
    - Two tracks: Amendments (top), Social Movements & Political Events (bottom)
    - Four amendment markers: 16th (1913), 17th (1913), 18th (1919), 19th (1920)
    - WWI band (1917–1918) shaded in gray with hover note tying it to ratification

    Each marker, when clicked, opens a detail panel with:
    - Amendment number and ratification year
    - What it changed
    - The movement / pressure that drove it
    - Historical context for the timing
    - Key figures and "What happened next?"

    Color scheme: gold = 16th, indigo = 17th, red = 18th, teal = 19th; gray for WWI.
    -->
