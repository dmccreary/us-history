    <!--
    SPECIFICATION (from chapter index.md):

    Type: comparison-timeline
    sim-id: tech-power-shifts
    Library: p5.js
    Status: Built

    Purpose: Allow students to compare the major technology power shifts across American history,
    identifying the consistent patterns (disruption -> concentration -> political response) and
    applying this framework to evaluate the AI era.

    Bloom Level: Evaluate (L5)
    Bloom Verb: Predict

    Learning Objective: Students evaluate the historical pattern of technology-driven power shifts,
    identify the structural similarities between AI and previous technology transformations, and
    predict - based on historical evidence - what political and economic responses to AI are most
    likely to emerge.

    Canvas layout:
    - Responsive width; height approximately 640px
    - Horizontal timeline from 1800 to ~2040 (with dashed projection beyond 2025)
    - Five technology eras shown as colored bands: Steam/Industrial, Railroad/Capital,
      Electricity/Mass Production, Computing/Internet, AI
    - Each band split into three sub-layers: Technology Change, Power Shift, Political Response

    Interactivity:
    - Click any era band to open a detail panel with five fields
    - "Pattern match" dropdown highlights the historical era closest to a selected AI challenge
    - "Response lag" toggle overlays a comparison of years between technology and political response

    Color scheme: Each era has a distinct color band; political response sub-layer tinted green.
    -->
