    <!--
    SPECIFICATION (from chapter index.md):

    Type: decision-tree
    sim-id: wwi-decision-tree
    Library: p5.js
    Status: Built

    Purpose: Allow students to trace the causal chain from the Sarajevo assassination (June 1914) through American entry (April 1917), clicking through each major decision point to understand why each step led to the next.

    Bloom Level: Analyze (L4)
    Bloom Verb: Trace

    Learning Objective: Students trace the causal chain from the assassination of Archduke Franz Ferdinand to U.S. declaration of war, identifying which steps were contingent (could have gone otherwise) and which were highly determined by prior commitments.

    Canvas layout:
    - Responsive width; height approximately 800px to fit the full vertical chain
    - Vertical decision tree with 10 nodes connected by arrows top-to-bottom
    - Each node shows: event, date, key decision-maker, and the choice made
    - Color-coded by actor: Austria-Hungary (gold), Germany (gray), Russia (red), Britain (blue), Serbia (dark orange), US (navy)
    - Contingent decisions (could have gone otherwise) get an amber highlight border
    - Pre-determined decisions (e.g., Britain's treaty obligation to Belgium) get a darker border

    Nodes in sequence:
    1. Sarajevo Assassination (June 28, 1914)
    2. Austria issues ultimatum to Serbia (July 23, 1914)
    3. Austria declares war on Serbia (July 28, 1914)
    4. Russia mobilizes (July 30, 1914)
    5. Germany declares war on Russia and invades Belgium (Aug 1–4, 1914)
    6. Britain declares war on Germany (Aug 4, 1914)
    7. US declares neutrality (Aug 4, 1914)
    8. Lusitania sinking and Sussex Pledge (1915–1916)
    9. Germany resumes unrestricted submarine warfare and Zimmermann Telegram (early 1917)
    10. US declares war on Germany (April 6, 1917)

    Interactivity:
    - Clicking each node opens a detail panel: what happened, why, and what alternatives existed
    - "Counterfactual" button on each node shows a 1-sentence alternative history
    - Reset button clears the selection
    -->
</body>
