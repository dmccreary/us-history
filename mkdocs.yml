# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'U.S. History'
site_description: 'An interactive intelligent textbook on United States History for high school students — from colonial origins through the modern era, aligned to state standards and College Board frameworks.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/us-history/'

hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/us-history'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Dan McCreary. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Historical Methods: chapters/01-historical-methods/index.md
      - 2. Pre-Columbian Contact: chapters/02-pre-columbian-contact/index.md
      - 3. Colonial America: chapters/03-colonial-america/index.md
      - 4. American Revolution: chapters/04-american-revolution/index.md
      - 5. Founding the Republic: chapters/05-founding-the-republic/index.md
      - 6. Jeffersonian Era: chapters/06-jeffersonian-era/index.md
      - 7. Manifest Destiny: chapters/07-manifest-destiny-reform/index.md
      - 8. Civil War: chapters/08-civil-war/index.md
      - 9. Reconstruction: chapters/09-reconstruction/index.md
      - 10. Gilded Age: chapters/10-gilded-age-industry/index.md
      - 11. Populism: chapters/11-populism-frontier/index.md
      - 12. Progressive Era: chapters/12-progressive-era/index.md
      - 13. Imperialism and WWI: chapters/13-imperialism-world-war-i/index.md
      - 14. Twenties and Depression: chapters/14-twenties-depression-new-deal/index.md
      - 15. World War II: chapters/15-world-war-ii/index.md
      - 16. Early Cold War: chapters/16-early-cold-war/index.md
      - 17. Civil Rights: chapters/17-civil-rights-great-society/index.md
      - 18. Vietnam and Nixon: chapters/18-vietnam-nixon/index.md
      - 19. Reagan to 9/11: chapters/19-reagan-to-9-11/index.md
      - 20. Digital Age: chapters/20-contemporary-america/index.md
      - 21. Age of AI: chapters/21-age-of-ai/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Taxonomy Distribution Report: learning-graph/taxonomy-distribution.md
      - Mascot Style Guide: learning-graph/mascot-test.md

  - MicroSims:
      - List of MicroSims: sims/index.md
      - Learning Graph Viewer: sims/graph-viewer/index.md

  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # logo: img/logo.png
  # favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  - social

# Social media overrides so that a local image is used instead of the default Material one.
hooks:
  - plugins/social_override.py

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - css/extra.css
  - css/mascot.css

exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-prompt.md
  **/TODO.md

watch:
  - docs
  - mkdocs.yml
  - plugins

extra:
  generator: false

  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    approved: Approved — tested and approved

  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'U.S. History'
  textbook_version: '0.1'
