          - Quiz: chapters/05-founding-the-republic/quiz.md
      - 6. Jeffersonian Era:
          - Content: chapters/06-jeffersonian-era/index.md
          - Quiz: chapters/06-jeffersonian-era/quiz.md
      - 7. Manifest Destiny:
          - Content: chapters/07-manifest-destiny-reform/index.md
          - Quiz: chapters/07-manifest-destiny-reform/quiz.md
      - 8. Civil War:
          - Content: chapters/08-civil-war/index.md
          - Quiz: chapters/08-civil-war/quiz.md
      - 9. Reconstruction:
          - Content: chapters/09-reconstruction/index.md
          - Quiz: chapters/09-reconstruction/quiz.md
      - 10. Gilded Age:
          - Content: chapters/10-gilded-age-industry/index.md
          - Quiz: chapters/10-gilded-age-industry/quiz.md
      - 11. Populism:
          - Content: chapters/11-populism-frontier/index.md
          - Quiz: chapters/11-populism-frontier/quiz.md
      - 12. Progressive Era:
          - Content: chapters/12-progressive-era/index.md
          - Quiz: chapters/12-progressive-era/quiz.md
      - 13. Imperialism and WWI:
          - Content: chapters/13-imperialism-world-war-i/index.md
          - Quiz: chapters/13-imperialism-world-war-i/quiz.md
      - 14. Twenties and Depression:
          - Content: chapters/14-twenties-depression-new-deal/index.md
          - Quiz: chapters/14-twenties-depression-new-deal/quiz.md
      - 15. World War II:
          - Content: chapters/15-world-war-ii/index.md
          - Quiz: chapters/15-world-war-ii/quiz.md
