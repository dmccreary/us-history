      - 18. Vietnam and Nixon:
          - Content: chapters/18-vietnam-nixon/index.md
          - Quiz: chapters/18-vietnam-nixon/quiz.md
      - 19. Reagan to 9/11:
          - Content: chapters/19-reagan-to-9-11/index.md
          - Quiz: chapters/19-reagan-to-9-11/quiz.md
