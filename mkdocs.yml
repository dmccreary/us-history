# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'U.S. History'
site_description: 'An interactive intelligent textbook on United States History for high school students — from colonial origins through the modern era, aligned to state standards and College Board frameworks.'
site_author: 'Dan McCreary'
site_url: 'https://dmccreary.github.io/us-history/'

