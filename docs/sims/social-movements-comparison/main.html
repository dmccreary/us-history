    Type: comparison

    Purpose: Allow students to compare the social movements of the late 1960s

    the Farmworkers Movement — across their constituencies, strategies, and
    legislative/cultural outcomes.

    Bloom Level: Analyze (L4)
    Bloom Verb: Compare

    Canvas layout:
    - Five movement cards in a row
    - Each card shows constituency, primary strategy, key victory, cultural impact
    - Click a card to expand into a full detail panel
    - "Compare two" mode lets the student select two cards for side-by-side view

    Interactivity:
    - Strategy filter highlights movements by primary strategy type
    - Outcome filter highlights legislative vs. cultural outcomes
    - Side-by-side view: select any two movements for detailed comparison

    Color scheme:
    - Civil Rights = green, Anti-War = blue, Feminism = purple,
      AIM = red, Farmworkers = orange
