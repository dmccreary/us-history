    <!--
    SPECIFICATION (from chapter index.md):

    Type: map
    sim-id: transportation-revolution-map
    Library: p5.js
    Status: Built

    Purpose: Allow students to visualize how canals, roads, and early railroads
    progressively connected the American economy between 1800 and 1860, and
    understand how transportation infrastructure shaped economic growth and
    regional integration.

    Bloom Level: Analyze (L4)
    Bloom Verb: Examine

    Learning Objective: Students examine how transportation networks shaped
    economic geography, explaining how the Erie Canal and railroad expansion
    connected markets and accelerated the Market Revolution.

    Canvas layout:
    - Responsive width; height approximately 700px
    - Simplified map of the eastern US and Midwest showing major waterways
    - Time slider at the bottom: 1800 -> 1820 -> 1840 -> 1860
    - As the slider advances, new transport routes appear on the map

    Transport layers:
    - 1800 (always visible): Major navigable rivers (dark blue) - Mississippi,
      Ohio, Hudson, Missouri. Cities as gold dots.
    - 1820: National Road (tan) and early turnpikes (Lancaster Turnpike).
    - 1825: Erie Canal (canal-blue dashed line, Buffalo -> Albany -> Hudson R.
      -> NYC). Click shows the cost/time calculation.
    - 1840: Early Northeast railroads (red) - Boston & Lowell, Camden & Amboy,
      Baltimore & Ohio (Baltimore -> Cumberland), early PA / NY lines.
    - 1860: Dense Northeast / Midwest rail network (more red lines): trunk
      lines connecting Boston / NYC / Philadelphia / Chicago / Cincinnati /
      St. Louis. Mentions New York Central and Pennsylvania Railroad
      consolidations.

    Clickable routes show a detail panel with: route name, completion date,
    what it connected, and a one-sentence economic-impact note.

    Color scheme:
    - Rivers: dark blue
    - Canals: light blue dashed
    - Roads / turnpikes: tan
    - Railroads: red
    - Major cities: gold dots
    -->
</body>
