    <!--
    SPECIFICATION (from chapter index.md):

    Type: infographic
    sim-id: integration-strategies
    Library: p5.js
    Status: Built

    Purpose: Help students understand and distinguish between vertical and
    horizontal integration through interactive diagrams that use Carnegie
    Steel and Standard Oil as concrete examples, with a modern parallel to
    Amazon and Big Tech.

    Bloom Level: Understand (L2)
    Bloom Verb: Explain

    Learning Objective: Students explain the difference between vertical
    and horizontal integration and give a historical example of each.

    Left panel — Vertical Integration (Carnegie Steel chain):
      Iron Ore Mines -> Great Lakes Ships -> Railroad Lines -> Coal/Coke
      -> Steel Mills -> Distribution Network. Each node shows ~% of total
      cost it represented and a strategic-advantage detail on click.

    Right panel — Horizontal Integration (Standard Oil hub & spokes):
      Standard Oil hub with 12 refineries radiating outward — gold = acquired,
      red = eliminated, gray = independent. Market-share readout grows as
      the empire is assembled.

    Toggle to "Modern Parallel" swaps Carnegie -> Amazon (vertical) and
    Standard Oil -> Big Tech acquisitions (horizontal).

    Compare / Advantages / Risks buttons annotate each diagram.
    Build +1 / Build All / Reset progressively grow the empire.
    -->
