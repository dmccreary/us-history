    SPECIFICATION (from chapter index.md):

    Type: causal-loop
    sim-id: depression-feedback-loops
    Library: p5.js
    Status: Built

    Purpose: Allow students to visualize the interlocking feedback loops that
    turned a stock market crash into a decade-long depression, building
    systems thinking skills by tracing causal connections across economic
    sectors.

    Bloom Level: Analyze (L4)
    Bloom Verb: Diagram

    Learning Objective: Students diagram the reinforcing feedback loops that
    amplified the 1929 crash into a decade-long depression, identifying which
    loops the New Deal attempted to break and how.

    Canvas layout:
    - Responsive width; height ~720px
    - Eight-node circular causal loop diagram (Stock Market, Consumer
      Spending, Business Production, Employment, Bank Deposits, Bank Loans,
      Agricultural Prices, International Trade)
    - Color-coded reinforcing loops (R1 deflationary spiral, R2 banking
      panic, R3 trade collapse, R4 wealth-effect shock)
    - Side panel describes the active loop and which New Deal program(s)
      targeted it

    Interactivity:
    - Click R1..R4 to highlight a loop
    - "Show New Deal Response" toggles program detail
    - "Shock Size" slider drives a cascade calculator showing how a market
      drop is amplified into industrial production, unemployment, world
      trade, and bank deposit losses
