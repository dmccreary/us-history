    <!--
    SPECIFICATION (from chapter index.md):

    Type: explorer
    sim-id: new-deal-programs
    Library: p5.js
    Status: Built

    Purpose: Allow students to explore the major New Deal programs, what
    problem each addressed, how it worked, and whether it survived to the
    present — building a comprehensive understanding of the New Deal's
    scope and lasting impact.

    Bloom Level: Understand (L2)
    Bloom Verb: Categorize

    Learning Objective: Students categorize New Deal programs by their
    purpose (relief, recovery, reform), identify the specific problem
    each addressed, and determine which programs still exist today.

    Canvas layout:
    - Responsive width; height 700px (drawHeight 640 + controlHeight 60)
    - Three columns: Relief | Recovery | Reform (FDR's framework)
    - Each program a clickable card with acronym, full name, year
    - Border color = current status: green (active), amber (modified /
      successor exists), red (ended)

    Programs by category:
    Relief:   CCC, FERA, CWA, WPA, PWA
    Recovery: AAA, NRA (struck down), RFC, TVA
    Reform:   FDIC, Glass-Steagall, SEC, Wagner Act, Social Security Act

    Detail panel (on click):
    - Full name and year
    - Problem addressed
    - How it worked
    - Scale (people / dollars)
    - Current status today

    Interactivity:
    - Hover shows acronym + 1-line summary
    - Filter by status: All / Active / Modified / Ended
    - Click card for details, click again or Reset to close

    Color scheme: blue (relief), gold (recovery), teal (reform);
                  green/amber/red status borders.
    -->
</body>
