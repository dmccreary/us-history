    <!--
    SPECIFICATION (from chapter index.md):

    Type: map
    sim-id: civil-war-strategy-map
    Library: p5.js
    Status: Built

    Purpose: Allow students to explore the geographic logic of Civil War strategy, trace major campaigns and battles, and understand how geography shaped Union and Confederate military choices.

    Bloom Level: Analyze (L4)
    Bloom Verb: Examine

    Learning Objective: Students examine how geography shaped Civil War military strategy, explaining the Anaconda Plan's logic and the significance of at least two major battles.

    Canvas layout:
    - Responsive width; height ~640px
    - Stylized map of the eastern and southern United States
    - Union (light blue), border (tan), Confederate (light red) shading
    - Mississippi River, simplified Atlantic + Gulf coastlines
    - Battle sites as 5-point stars (gold = Union win, red = Confederate win)

    Key battles:
    Fort Sumter (1861), First Bull Run (1861), Shiloh (1862), Second Bull Run (1862),
    Antietam (1862), Chancellorsville (1863), Vicksburg (1863), Gettysburg (1863),
    Atlanta (1864), Petersburg (1864-65), Appomattox (1865).

    Click a battle: date, victor, casualties, strategic significance, connection to a key event.

    Strategy overlays (toggleable):
    - Anaconda Plan: dotted blockade line + inward arrows along the coast
    - Mississippi campaign: blue arrows down the river
    - Eastern Theater: Lee's invasions north
    - Western Theater: Grant's southern push
    - Sherman's March (1864): Atlanta to Savannah to Columbia

    Year slider 1861-1865 progressively reveals battles.
    -->
</body>
