<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reform Movement Network — 1830–1860</title>
    <script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app">
        <div class="toolbar">
            <span class="toolbar-title">Antebellum Reform Network</span>
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="abolitionism">Abolitionism only</button>
            <button class="filter-btn" data-filter="womens-rights">Women's Rights only</button>
            <button class="filter-btn" data-filter="people">People only</button>
            <button class="filter-btn" data-filter="reset">Reset</button>
        </div>

        <div class="work">
            <div class="graph-area">
                <div id="network"></div>

                <div class="legend" aria-label="Legend">
                    <div class="legend-row"><span class="legend-swatch movement"></span>Movement</div>
                    <div class="legend-row"><span class="legend-swatch person"></span>Person</div>
                    <div class="legend-row"><span class="legend-swatch organization"></span>Organization</div>
                    <div class="legend-row"><span class="legend-swatch idea"></span>Idea</div>
                </div>

                <div id="zoom-hint">Scroll to zoom &nbsp;|&nbsp; drag to pan &nbsp;|&nbsp; click nodes &amp; edges</div>
            </div>

            <aside class="panel" id="panel">
                <h2>Reform Movement Network</h2>
                <p class="empty-hint">Click any node to see details.</p>
            </aside>
        </div>
    </div>

    <script src="reform-movement-network.js"></script>
</body>
</html>
