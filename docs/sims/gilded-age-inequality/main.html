    Type: chart
    sim-id: gilded-age-inequality
    Library: p5.js
    Status: Built

    Purpose: Allow students to visualize wealth distribution in the Gilded Age,
    compare it to other historical periods, and connect it to the social
    conflicts of the era.

    Bloom Level: Analyze (L4)
    Bloom Verb: Compare

    Learning Objective: Students compare wealth distribution across historical
    periods and explain how extreme inequality in the Gilded Age contributed to
    the rise of labor and reform movements.

    Periods: 1870, 1900, 1929 (peak), 1970 (post-New Deal low), 2020.
    Stacked bar of Top 1% / Next 9% / Bottom 90% national wealth shares.

    View modes: Stacked / Top 1% only / Top 10% only / Bottom 90% only.
    Click a bar for era context (policy, labor movement). "Show transitions"
    cycles through narrative explanations of what drove each shift.

    Color scheme: Top 1% gold (#f9a825), Next 9% indigo (#3949ab),
    Bottom 90% teal (#00897b).
