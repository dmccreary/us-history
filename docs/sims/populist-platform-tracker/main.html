    <!--
    SPECIFICATION (from chapter index.md):

    Type: infographic
    sim-id: populist-platform-tracker
    Library: p5.js
    Status: Built

    Purpose: Allow students to explore the 1892 People's Party platform
    demands and track which were eventually enacted into law, when, and
    under what political conditions — illustrating how "radical" reform
    ideas move from the margins to the mainstream.

    Bloom Level: Analyze (L4)
    Bloom Verb: Examine

    Learning Objective: Students examine how political demands that seem
    radical in one era become mainstream in another, and identify the
    political conditions that enabled or blocked the adoption of Populist
    demands.

    Canvas layout:
    - Responsive width; height 700px (drawHeight 640 + controlHeight 60)
    - Two-column grid of eight Populist demand cards
    - Each card: number, title, mechanism, status pill (green/amber/red),
      year. Gold border per spec.
    - Click any card for full detail panel (problem, path, legacy,
      enabling/blocking conditions).

    Demands tracked (1892 Omaha Platform):
      1. Graduated income tax — 16th Amendment (1913) — ENACTED
      2. Direct election of senators — 17th Amendment (1913) — ENACTED
      3. Secret ballot — state-by-state, 1888-1910s — ENACTED
      4. Eight-hour workday — FLSA (1938) — ENACTED
      5. Postal savings banks — Postal Savings System (1910-1967) — ENACTED
      6. Government ownership of railroads — ICC + WWI brief — PARTIAL
      7. Free silver — Gold standard abandoned 1933, fiat money — PARTIAL
      8. Subtreasury system — Farm Credit Act 1933, AAA — PARTIAL

    Interactivity:
    - Filter by status: All / Enacted / Partial / Rejected
    - Click card for details, click again or Reset to close
    - Hover shows 1-line summary in bottom panel

    Color scheme: Green/amber/red status badges; gold card borders;
                  white panels.
    -->
</body>
