<!--
Populist Policy Platform — Then and Now
sim-id: populist-platform-tracker
Library: p5.js
Status: Built

Purpose: Allow students to explore the 1892 People's Party (Omaha) platform
demands and track which were eventually enacted into law, when, and under
what political conditions — illustrating how "radical" reform ideas move
from the margins to the mainstream.

Bloom Level: Analyze (L4)
Bloom Verb: Examine

Learning Objective: Students examine how political demands that seem
radical in one era become mainstream in another, and identify the political
conditions that enabled or blocked the adoption of Populist demands.

Interactivity:
- Eight clickable platform cards arranged in a 4x2 grid (status color-coded)
- Click a card to open a detail panel with full demand text, enactment
  year, law/amendment name, and a 1-sentence note on why it took so long.
- Filter buttons: All, Enacted, Partial, Not Enacted, Timeline view
- Timeline view replaces grid with a horizontal 1892 -> today timeline.
-->
